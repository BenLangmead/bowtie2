name: Simple Tests
on:
  push:
    branches:
      - 'bug_fixes'
      - 'master'
    paths:
      - '**.h'
      - '**.cpp'
      - 'bowtie2'
      - 'bowtie2-build'
      - 'bowtie2-inspect'
      - 'Makefile'
      - 'scripts/sim/**'
      - 'scripts/test/**'
  pull_request:
    branches:
      - 'master'
    paths:
      - '**.h'
      - '**.cpp'
      - 'bowtie2'
      - 'bowtie2-build'
      - 'bowtie2-inspect'
      - 'Makefile'
      - 'scripts/sim/**'
      - 'scripts/test/**'
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2
      - name: Install zlib development files
        run: |
          sudo apt-get update
          sudo apt-get install zlib1g-dev
  linux:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v2
      - name: Run simple tests
        run: |
          make clean; make -j4 allall
          make simple-test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pytest suite
        run: |
          python -m pip install pytest
          python -m pytest scripts/test -q -rs
  linux-noavx2:
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/checkout@v2
      - name: Run simple tests without using AVX2
        run: |
          export SSE_AVX2=0
          make clean; make -j4 allall
          make simple-test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pytest suite
        run: |
          python -m pip install pytest
          python -m pytest scripts/test -q -rs
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - name: Pull submodules
        run: |
          git submodule init
          git submodule update
      - name: Run simple tests
        run: |
          make clean; make -j4 allall
          make simple-test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pytest suite
        run: |
          python -m pip install pytest
          python -m pytest scripts/test -q -rs
